<svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" aria-label="Pierre vous accueille">
  <defs>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8dcb0"/>
      <stop offset="100%" stop-color="#e8c08a"/>
    </linearGradient>
  </defs>

  <!-- ========== Buste (apron + chemise) ========== -->
  <!-- Chemise creme -->
  <path d="M 70 175 Q 70 165 80 165 L 160 165 Q 170 165 170 175 L 175 280 L 65 280 Z"
        fill="#fffbf0"/>

  <!-- Tablier d'artisan en cuir -->
  <path d="M 82 168 L 158 168 L 168 280 L 72 280 Z" fill="#a8703f"/>
  <path d="M 82 168 L 158 168 L 160 198 L 80 198 Z" fill="#c08850"/>

  <!-- Bretelles tablier -->
  <path d="M 92 168 Q 110 145 130 145 Q 150 145 148 168"
        stroke="#7a4f2a" stroke-width="3" fill="none"/>

  <!-- Poche centrale -->
  <rect x="100" y="225" width="50" height="38" rx="2" fill="#7a4f2a"/>
  <line x1="125" y1="225" x2="125" y2="263" stroke="#5a3818" stroke-width="1.5"/>

  <!-- Rivets en laiton -->
  <circle cx="86" cy="195" r="3" fill="#c8923f"/>
  <circle cx="154" cy="195" r="3" fill="#c8923f"/>
  <circle cx="100" cy="225" r="2" fill="#c8923f"/>
  <circle cx="150" cy="225" r="2" fill="#c8923f"/>

  <!-- Stylo dans la poche -->
  <rect x="138" y="220" width="4" height="14" rx="1" fill="#1e3a5f"/>
  <circle cx="140" cy="220" r="2" fill="#c8923f"/>

  <!-- Cou -->
  <rect x="108" y="148" width="24" height="22" fill="url(#skinGrad)"/>

  <!-- ========== Tete ========== -->
  <!-- Beret -->
  <ellipse cx="120" cy="48" rx="55" ry="18" fill="#1e3a5f"/>
  <ellipse cx="120" cy="44" rx="48" ry="14" fill="#2c5282"/>
  <circle cx="155" cy="34" r="6" fill="#1e3a5f"/>

  <!-- Visage -->
  <ellipse cx="120" cy="100" rx="48" ry="50" fill="url(#skinGrad)"/>

  <!-- Joues rosees -->
  <ellipse cx="86" cy="112" rx="8" ry="5" fill="#e89c80" opacity="0.55"/>
  <ellipse cx="154" cy="112" rx="8" ry="5" fill="#e89c80" opacity="0.55"/>

  <!-- Cheveux lateraux -->
  <path d="M 75 88 Q 68 102 73 118" stroke="#3d2817" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 165 88 Q 172 102 167 118" stroke="#3d2817" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Sourcils legerement leves (accueillant) -->
  <path d="M 92 88 Q 100 84 108 88" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 132 88 Q 140 84 148 88" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Yeux -->
  <ellipse cx="100" cy="100" rx="4.5" ry="5.5" fill="#1a1a2e"/>
  <ellipse cx="140" cy="100" rx="4.5" ry="5.5" fill="#1a1a2e"/>
  <circle cx="101.5" cy="98" r="1.4" fill="#ffffff"/>
  <circle cx="141.5" cy="98" r="1.4" fill="#ffffff"/>

  <!-- Moustache iconique -->
  <path d="M 96 124 Q 108 134 120 128 Q 132 134 144 124"
        stroke="#3d2817" stroke-width="6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sourire chaleureux -->
  <path d="M 105 138 Q 120 146 135 138"
        stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Petite bulle (signe de salutation, optionnel) -->
  <g opacity="0.85">
    <circle cx="200" cy="60" r="3" fill="#c8923f"/>
    <circle cx="208" cy="48" r="2" fill="#c8923f"/>
    <circle cx="214" cy="40" r="1.5" fill="#c8923f"/>
  </g>
</svg>
