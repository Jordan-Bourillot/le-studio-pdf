<svg viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" aria-label="Bertrand le blaireau">
  <g stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- Oreille gauche -->
    <g transform="rotate(-18 24 30)">
      <ellipse cx="24" cy="30" rx="9" ry="11" fill="#8a6d52"/>
      <ellipse cx="24" cy="30" rx="4" ry="5.5" fill="#e89c80" stroke-width="2"/>
    </g>

    <!-- Oreille droite -->
    <g transform="rotate(18 86 30)">
      <ellipse cx="86" cy="30" rx="9" ry="11" fill="#8a6d52"/>
      <ellipse cx="86" cy="30" rx="4" ry="5.5" fill="#e89c80" stroke-width="2"/>
    </g>

    <!-- Tete (silhouette ronde) -->
    <path d="M 55 26
             C 28 26 20 46 24 64
             C 28 82 42 92 55 92
             C 68 92 82 82 86 64
             C 90 46 82 26 55 26 Z"
          fill="#8a6d52"/>

    <!-- Visage blanc -->
    <path d="M 55 32
             C 38 34 32 50 34 62
             C 38 78 46 84 55 84
             C 64 84 72 78 76 62
             C 78 50 72 34 55 32 Z"
          fill="#fff5e8" stroke-width="2.2"/>

    <!-- Bande noire gauche (signature blaireau) -->
    <path d="M 41 34
             C 32 40 28 52 30 62
             C 32 70 38 72 44 68
             C 47 58 46 42 41 34 Z"
          fill="#1a1a2e" stroke-width="0"/>

    <!-- Bande noire droite -->
    <path d="M 69 34
             C 78 40 82 52 80 62
             C 78 70 72 72 66 68
             C 63 58 64 42 69 34 Z"
          fill="#1a1a2e" stroke-width="0"/>

    <!-- Sourcil gauche (relevé, espiègle) -->
    <path d="M 32 44 L 44 40" stroke-width="3" fill="none"/>

    <!-- Sourcil droit -->
    <path d="M 78 44 L 66 40" stroke-width="3" fill="none"/>

    <!-- Yeux blancs -->
    <ellipse cx="40" cy="50" rx="4" ry="4.5" fill="#fff5e8" stroke-width="2"/>
    <ellipse cx="70" cy="50" rx="4" ry="4.5" fill="#fff5e8" stroke-width="2"/>

    <!-- Pupilles décentrées (regard malicieux) -->
    <circle cx="41.5" cy="50.5" r="2.2" fill="#1a1a2e" stroke-width="0"/>
    <circle cx="71.5" cy="50.5" r="2.2" fill="#1a1a2e" stroke-width="0"/>

    <!-- Petits éclats brillants -->
    <circle cx="42.5" cy="49.5" r="0.9" fill="#fff5e8" stroke-width="0"/>
    <circle cx="72.5" cy="49.5" r="0.9" fill="#fff5e8" stroke-width="0"/>

    <!-- Museau (poire claire) -->
    <path d="M 44 68 Q 55 74 66 68 Q 64 82 55 84 Q 46 82 44 68 Z"
          fill="#fff5e8" stroke-width="2"/>

    <!-- Truffe noire -->
    <path d="M 49 70 Q 55 76 61 70 Q 58 73 55 73 Q 52 73 49 70 Z"
          fill="#1a1a2e" stroke-width="2"/>

    <!-- Bouche en biais (sourire malin) -->
    <path d="M 50 80 Q 56 84 62 81" stroke-width="2.5" fill="none"/>

    <!-- Beret (incliné, BD) -->
    <g transform="rotate(-12 55 16)">
      <path d="M 25 18 Q 22 6 38 4 L 78 6 Q 86 8 84 18 C 70 24 38 24 25 18 Z"
            fill="#1e3a5f"/>
      <path d="M 30 14 Q 28 10 38 8 L 76 10" stroke="#2c5282" stroke-width="2" fill="none"/>
      <circle cx="80" cy="6" r="3.5" fill="#1e3a5f"/>
    </g>

  </g>
</svg>
