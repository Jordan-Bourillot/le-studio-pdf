name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Generate Bertrand .ico
        run: python tools/make_icon.py

      - name: Build executable with PyInstaller
        run: pyinstaller studio_pdf.spec --noconfirm

      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/prereqs | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'installer/prereqs/vc_redist.x64.exe' -UseBasicParsing
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?LinkId=2085155' -OutFile 'installer/prereqs/ndp48-web.exe' -UseBasicParsing

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=$version" installer\studio_pdf.iss

      - name: Detect prerelease
        id: prerelease
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'beta|alpha|rc') {
            "is_prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "is_prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Le Studio PDF ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            installer_output/LeStudioPDF_setup_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
